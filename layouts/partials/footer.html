<footer class="site-footer">
  <div class="container footer-grid">
    <div class="footer-col">
      <div class="footer-brand-row">
        <img class="brand-logo" src="{{ "images/logo-light.png" | relURL }}" alt="{{ site.Params.nameZh }}標誌">
        <p class="footer-brand">{{ site.Params.nameZh }}<span>{{ site.Params.nameEn }}</span></p>
      </div>
      <p>{{ site.Params.tagline }}</p>
      <a class="footer-whatsapp" href="https://wa.me/{{ site.Params.whatsapp }}" target="_blank" rel="noopener">
        {{ partial "icons.html" "whatsapp" }}<span>{{ site.Params.whatsappDisplay }}</span>
      </a>
    </div>
    <div class="footer-col">
      <h3>診所地址</h3>
      <p>{{ site.Params.address }}</p>
      <p><a href="{{ site.Params.mapURL }}" target="_blank" rel="noopener">{{ partial "icons.html" "pin" }} 查看地圖</a></p>
    </div>
  </div>
  <div class="container footer-bottom">
    <p>© {{ now.Year }} {{ site.Params.nameZh }}</p>
    <p>{{ site.Params.nameEn }}</p>
  </div>
</footer>
