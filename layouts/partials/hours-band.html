<div class="hours-band">
  <div class="container hours-inner">
    <div>
      <p class="eyebrow">Opening Hours</p>
      <h2>應診時間</h2>
      <p>{{ site.Params.hoursWeekday }}<br>{{ site.Params.hoursSaturday }}<br>{{ site.Params.hoursSunday }}</p>

    <a class="btn btn-whatsapp" href="https://wa.me/{{ site.Params.whatsapp }}" target="_blank" rel="noopener">
      {{ partial "icons.html" "whatsapp" }}<span>{{ site.Params.whatsappDisplay }}</span>
    </a>
  </div>
</div>
